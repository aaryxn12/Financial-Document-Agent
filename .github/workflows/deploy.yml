name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let the running one finish.
concurrency:
  group: deploy-main
  cancel-in-progress: false

# Needed so the job can request the GitHub OIDC "badge" for AWS.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: financial-document-agent
  LAMBDA_FUNCTION: financial-document-agent

jobs:
  deploy:
    # Native arm64 runner: the Lambda is arm64, so no emulation is needed.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build \
            --platform linux/arm64 \
            --provenance=false \
            --sbom=false \
            -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Point Lambda at the new image
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "${{ steps.image.outputs.uri }}" \
            --output text --query 'LastUpdateStatus'

      - name: Wait until the update finishes
        run: aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"

      - name: Smoke test the live URL (no LLM calls)
        env:
          FUNCTION_URL: ${{ vars.FUNCTION_URL }}
        run: |
          set -euo pipefail
          URL=$(printf '%s' "$FUNCTION_URL" | tr -d '[:space:]"')
          URL="${URL%/}"

          echo "1/3 App boots and routes"
          curl --fail --silent --show-error --max-time 60 "$URL/openapi.json" > /dev/null

          echo "2/3 Upload: PDF parsing, chunking, embedding model, S3 write"
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 120 \
            -F "file=@tests/fixtures/smoke.pdf;type=application/pdf" "$URL/documents")
          echo "$RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys, json; r = json.load(sys.stdin); assert r['document_id'] and r['chunk_count'] > 0, r"

          echo "3/3 Unknown id: S3 read path ends in the app's own 404"
          STATUS=$(curl --silent --max-time 60 -o body.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{"question":"ping"}' \
            "$URL/documents/does-not-exist/ask")
          cat body.json; echo
          test "$STATUS" = "404"
          grep -q "Unknown document_id" body.json

          echo "Live URL passed all smoke checks."
